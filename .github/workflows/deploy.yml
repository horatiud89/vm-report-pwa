name: Deploy

# Tests, then publishes the app to the owner's Firebase project.
# Needs the repository secrets listed in docs/setup/firebase-setup.ro.md;
# without FIREBASE_SERVICE_ACCOUNT it skips every step and finishes green.

on:
  push:
    branches:
      - claude/medicine-photo-feedback-app-uk8m8b
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Firebase configuration
        id: guard
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_SA" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase not configured yet — skipping deploy"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci

      - name: Unit tests
        if: steps.guard.outputs.configured == 'true'
        run: npm test

      - name: Build app
        if: steps.guard.outputs.configured == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: npm run build -w app

      # Functions read APP_URL (links in push notifications); the file is git-ignored.
      - name: Write functions environment
        if: steps.guard.outputs.configured == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: printf 'APP_URL=https://%s.web.app\n' "$FIREBASE_PROJECT_ID" > functions/.env

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        if: steps.guard.outputs.configured == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore,storage,functions --non-interactive --force

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.guard.outputs.configured == 'true'

      # The PDF export downloads photos from the browser, so the bucket must allow GET from the hosting origins.
      - name: Apply Storage CORS
        if: steps.guard.outputs.configured == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          sed "s/__PROJECT_ID__/${FIREBASE_PROJECT_ID}/g" storage.cors.template.json > storage.cors.json
          jq empty storage.cors.json
          gcloud storage buckets update "gs://$FIREBASE_STORAGE_BUCKET" --cors-file=storage.cors.json
