name: Seed demo

# Manual run: creates the demo store, its zones and the demo accounts.
# Safe to run again; existing data is kept.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Firebase configuration
        id: guard
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_SA" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase not configured yet — skipping seed"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci

      - name: Build functions
        if: steps.guard.outputs.configured == 'true'
        run: npm run build -w functions

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Seed demo data
        if: steps.guard.outputs.configured == 'true'
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          GCLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npm run seed -w functions
